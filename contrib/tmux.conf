# Example tmux knobs for ttybus. Not sourced by default.
#
# Isolate panes in this tmux server onto a named bus (opt-in).
# $TMUX contains commas and slashes; ttybus sanitizes them.
#   set-environment -g TTYBUS_BUS "$TMUX"
#
# Announce session name on create (requires ttybus on PATH):
#   set-hook -g session-created 'run-shell "ttybus pub tmux #{session_name}"'
#
# Unicast to a known TUI id (the TUI should HELLO with a stable id, or
# export TTYBUS_ID for shells it spawns):
#   bind-key e run-shell 'ttybus send --to my-editor files "#{pane_current_path}"'
#
# Do not put `ttybus sub` in status-right; a long-running filter in the
# status line is the wrong shape.
